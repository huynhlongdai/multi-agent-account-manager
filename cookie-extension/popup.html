<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Manager Direct Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <header class="header">
      <div class="logo-box">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"></path>
          <path d="M8.5 8.5v.01"></path>
          <path d="M11.5 15.5v.01"></path>
          <path d="M15.5 11.5v.01"></path>
        </svg>
      </div>
      <div class="title-wrap">
        <h1 class="title">Account Sync</h1>
        <p class="subtitle">Direct to Desktop Account Manager</p>
      </div>
    </header>

    <!-- Desktop App Connection Banner -->
    <div id="app-conn-box" class="conn-box checking">
      <span class="conn-dot"></span>
      <span id="conn-text" class="conn-text">Checking Desktop App connection...</span>
    </div>

    <div class="site-info">
      <div class="site-row">
        <span class="label">Target Service:</span>
        <span id="service-badge" class="badge">Detecting...</span>
      </div>
      <div class="site-row">
        <span class="label">Detected Account:</span>
        <input id="account-alias" class="alias-input" type="text" placeholder="e.g. user@gmail.com" />
      </div>
      <div class="site-row">
        <span class="label">Cookies Found:</span>
        <span id="cookie-count" class="badge count">0</span>
      </div>
    </div>

    <div id="domains-list" class="domains-box">
      <!-- Target domains -->
    </div>

    <div class="actions">
      <!-- 1-Click Direct Sync Button -->
      <button id="direct-sync-btn" class="btn primary direct-sync" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span id="sync-btn-text">1-Click Sync to App</span>
      </button>

      <!-- Fallback Copy Button -->
      <button id="copy-btn" class="btn secondary" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span>Copy Cookies Manually</span>
      </button>
    </div>

    <div id="status-toast" class="toast" hidden></div>

    <footer class="footer">
      <p id="footer-hint" class="hint">⚡ Click <b>1-Click Sync</b> to automatically add or update this account in your Desktop App without copy-pasting.</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
